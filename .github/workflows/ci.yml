name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test # builds, then runs every package's tests

  example:
    name: Example app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so --changed can find the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo-app/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: examples/expo-app
      - name: Showcase tests (record snapshots)
        run: npx jest
        working-directory: examples/expo-app
        env:
          V6Y_SNAPSHOTS: .v6y/snapshots
      # Dogfooding the action. The example's "before" screens are broken on purpose,
      # so this annotates PRs that touch them without failing the build.
      - name: v6y on changed files
        uses: ./
        continue-on-error: true
        with:
          working-directory: examples/expo-app
